name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0. Leave empty to only build and upload the exe as an artifact."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools and packages
        run: python -m pip install pyinstaller==6.11.1 numpy==2.4.5 lz4==4.4.5 pyooz==0.0.8

      - name: Build gow-shrink.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name gow-shrink
          --add-data "tool/games.json;tool"
          --collect-submodules tool
          --hidden-import ooz
          gow_shrink.pyw

      - name: Check the bundled tool
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/gow-shrink.exe -ArgumentList '--tool', '--help' -NoNewWindow -Wait -PassThru -RedirectStandardOutput help.txt
          Get-Content help.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: gow-shrink
          path: dist/gow-shrink.exe

      - name: Create or update the release
        if: env.TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" dist/gow-shrink.exe --clobber
          } else {
            gh release create "$env:TAG" dist/gow-shrink.exe --title "$env:TAG" --target "${{ github.sha }}" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
